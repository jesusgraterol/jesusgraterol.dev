<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jesus Graterol open graph image</title>
    <style>
      @font-face {
        font-family: 'Ubuntu Sans Variable';
        font-style: normal;
        font-weight: 100 800;
        src: url('../node_modules/@fontsource-variable/ubuntu-sans/files/ubuntu-sans-latin-wght-normal.woff2')
          format('woff2-variations');
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #fefdfb;
        color: #132125;
        font-family: 'Ubuntu Sans Variable', sans-serif;
      }
      .canvas {
        position: relative;
        display: flex;
        width: 1200px;
        height: 630px;
        flex-direction: column;
        padding: 56px 64px;
        overflow: hidden;
      }
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.55;
        background-image:
          linear-gradient(to right, #e1e8e6 1px, transparent 1px),
          linear-gradient(to bottom, #e1e8e6 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to right, black, transparent 72%);
      }
      .topbar,
      .content {
        position: relative;
        z-index: 1;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 30px;
        border-bottom: 1px solid #dfe3e2;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        font-weight: 700;
      }
      .mark {
        display: block;
        width: 48px;
        height: 48px;
      }
      .domain {
        color: #697371;
        font-family: ui-monospace, monospace;
        font-size: 16px;
      }
      .content {
        display: grid;
        flex: 1;
        grid-template-columns: 1fr 300px;
        gap: 64px;
        align-items: center;
      }
      .eyebrow {
        margin: 0 0 18px;
        color: #087864;
        font-family: ui-monospace, monospace;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 680px;
        margin: 0;
        font-size: 76px;
        font-variation-settings: 'wght' 650;
        letter-spacing: -4.5px;
        line-height: 0.93;
      }
      .thesis {
        margin: 24px 0 0;
        color: #586360;
        font-size: 25px;
        line-height: 1.35;
      }
      .portrait-wrap {
        position: relative;
      }
      .portrait {
        display: block;
        width: 280px;
        height: 280px;
        border: 1px solid #dfe3e2;
        border-radius: 30px;
        background: #eef2f1;
        object-fit: cover;
      }
      .status {
        position: absolute;
        right: -16px;
        bottom: -16px;
        padding: 12px 16px;
        border: 1px solid #dfe3e2;
        border-radius: 11px;
        background: white;
        font-size: 14px;
        font-weight: 700;
      }
      .status::before {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 50%;
        background: #087864;
        content: '';
      }
    </style>
  </head>
  <body>
    <main
      class="canvas"
      aria-label="Jesus Graterol social preview"
    >
      <div class="grid"></div>
      <div class="topbar">
        <div class="brand">
          <img
            class="mark"
            src="../public/favicons/128x128.png"
            alt=""
          />
          <span>Jesus Graterol</span>
        </div>
        <span class="domain">jesusgraterol.dev</span>
      </div>
      <div class="content">
        <div>
          <p class="eyebrow">Software Developer</p>
          <h1>I build software for ambitious ideas.</h1>
          <p class="thesis">Strong foundations. Modern AI. Ambitious outcomes.</p>
        </div>
        <div class="portrait-wrap">
          <img
            class="portrait"
            src="../public/avatar.jpg"
            alt=""
          />
          <div class="status">10+ years building</div>
        </div>
      </div>
    </main>
  </body>
</html>
